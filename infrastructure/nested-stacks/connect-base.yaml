AWSTemplateFormatVersion: "2010-09-09"
Description: Quinn - Amazon Connect Base Resources (Nested Stack)

Parameters:
  Environment:
    Type: String
    Description: Environment name

Resources:
  # ============================================
  # AMAZON CONNECT - Base Resources
  # ============================================
  ConnectInstance:
    Type: AWS::Connect::Instance
    Properties:
      IdentityManagementType: CONNECT_MANAGED
      InstanceAlias: !Sub quinn-connect-${Environment}-${AWS::AccountId}
      Attributes:
        InboundCalls: false
        OutboundCalls: true
        ContactflowLogs: true
        ContactLens: false
        AutoResolveBestVoices: true
        UseCustomTTSVoices: false
        EarlyMedia: true

  ConnectHoursOfOperation:
    Type: AWS::Connect::HoursOfOperation
    DependsOn: ConnectInstance
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: !Sub quinn-hours-${Environment}
      Description: 24/7 hours of operation for Quinn AI
      TimeZone: Europe/London
      Config:
        - Day: SUNDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: MONDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: TUESDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: WEDNESDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: THURSDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: FRIDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: SATURDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59

  ConnectQueue:
    Type: AWS::Connect::Queue
    DependsOn: ConnectHoursOfOperation
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: !Sub quinn-outbound-queue-${Environment}
      Description: Queue for Quinn AI outbound calls
      HoursOfOperationArn: !GetAtt ConnectHoursOfOperation.HoursOfOperationArn
      MaxContacts: 10
      Status: ENABLED

  RecordingsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub quinn-recordings-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldRecordings
            Status: Enabled
            ExpirationInDays: 90
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30

Outputs:
  ConnectInstanceId:
    Description: Amazon Connect Instance ID
    Value: !GetAtt ConnectInstance.Id

  ConnectInstanceArn:
    Description: Amazon Connect Instance ARN
    Value: !GetAtt ConnectInstance.Arn

  ConnectQueueArn:
    Description: Amazon Connect Queue ARN
    Value: !GetAtt ConnectQueue.QueueArn

  HoursOfOperationArn:
    Description: Hours of Operation ARN
    Value: !GetAtt ConnectHoursOfOperation.HoursOfOperationArn

  RecordingsBucketName:
    Description: S3 Bucket for call recordings
    Value: !Ref RecordingsBucket

  RecordingsBucketArn:
    Description: S3 Bucket ARN for call recordings
    Value: !GetAtt RecordingsBucket.Arn
