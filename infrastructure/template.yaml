AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Quinn - AI Personal Assistant Infrastructure

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

  DomainName:
    Type: String
    Default: ""
    Description: Custom domain name (optional)

  GmailClientId:
    Type: String
    Default: ""
    Description: Gmail OAuth Client ID

  GmailClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Gmail OAuth Client Secret

  GmailRedirectUri:
    Type: String
    Default: ""
    Description: Gmail OAuth Redirect URI (e.g., https://api.example.com/dev/integrations/gmail/callback)

  PlaidClientId:
    Type: String
    Default: ""
    Description: Plaid Client ID

  PlaidSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: Plaid Secret

  PlaidEnv:
    Type: String
    Default: "sandbox"
    AllowedValues:
      - sandbox
      - development
      - production
    Description: Plaid Environment

  EnableConnect:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable Amazon Connect for phone calls

  ConnectSourcePhoneNumber:
    Type: String
    Default: ""
    Description: Phone number claimed in Amazon Connect (e.g., +44xxxxxxxxxx). Must be claimed manually in AWS Console.

  EnableSMS:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable SMS notifications via SNS/Pinpoint

  EnablePushNotifications:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable push notifications via SNS

Conditions:
  CreateConnectResources: !Equals [!Ref EnableConnect, "true"]
  CreateSMSResources: !Equals [!Ref EnableSMS, "true"]
  CreatePushResources: !Equals [!Ref EnablePushNotifications, "true"]

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DYNAMODB_TABLE: !Ref MainTable
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        GMAIL_CLIENT_ID: !Ref GmailClientId
        GMAIL_CLIENT_SECRET: !Ref GmailClientSecret
        GMAIL_REDIRECT_URI: !Ref GmailRedirectUri
        PLAID_CLIENT_ID: !Ref PlaidClientId
        PLAID_SECRET: !Ref PlaidSecret
        PLAID_ENV: !Ref PlaidEnv
        FRONTEND_URL: !Sub https://${CloudFrontDistribution.DomainName}
        CONNECT_INSTANCE_ID: !If [CreateConnectResources, !GetAtt ConnectInstance.Id, ""]
        CONNECT_CONTACT_FLOW_ID:
          !If [CreateConnectResources, !GetAtt OutboundContactFlow.ContactFlowArn, ""]
        CONNECT_QUEUE_ARN: !If [CreateConnectResources, !GetAtt ConnectQueue.QueueArn, ""]
        CONNECT_SOURCE_PHONE_NUMBER: !Ref ConnectSourcePhoneNumber
        RECORDINGS_BUCKET: !If [CreateConnectResources, !Ref RecordingsBucket, ""]
        PINPOINT_APP_ID: !If [CreateSMSResources, !Ref PinpointApp, ""]
        SNS_PLATFORM_ARN_IOS: !If [CreatePushResources, !Ref SNSPlatformApplicationIOS, ""]
        SNS_PLATFORM_ARN_ANDROID: !If [CreatePushResources, !Ref SNSPlatformApplicationAndroid, ""]

Resources:
  # ============================================
  # AMAZON CONNECT - Phone Calls
  # ============================================
  ConnectInstance:
    Type: AWS::Connect::Instance
    Condition: CreateConnectResources
    Properties:
      IdentityManagementType: CONNECT_MANAGED
      InstanceAlias: !Sub quinn-connect-${Environment}-${AWS::AccountId}
      Attributes:
        InboundCalls: false
        OutboundCalls: true
        ContactflowLogs: true
        ContactLens: false
        AutoResolveBestVoices: true
        UseCustomTTSVoices: false
        EarlyMedia: true

  ConnectHoursOfOperation:
    Type: AWS::Connect::HoursOfOperation
    Condition: CreateConnectResources
    DependsOn: ConnectInstance
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: !Sub quinn-hours-${Environment}
      Description: 24/7 hours of operation for Quinn AI
      TimeZone: Europe/London
      Config:
        - Day: SUNDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: MONDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: TUESDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: WEDNESDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: THURSDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: FRIDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: SATURDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59

  ConnectQueue:
    Type: AWS::Connect::Queue
    Condition: CreateConnectResources
    DependsOn: ConnectHoursOfOperation
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: !Sub quinn-outbound-queue-${Environment}
      Description: Queue for Quinn AI outbound calls
      HoursOfOperationArn: !GetAtt ConnectHoursOfOperation.HoursOfOperationArn
      MaxContacts: 10
      Status: ENABLED

  # Initial outbound contact flow - will be updated by Custom Resource to include Lex bot
  OutboundContactFlow:
    Type: AWS::Connect::ContactFlow
    Condition: CreateConnectResources
    DependsOn: ConnectInstance
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: !Sub quinn-outbound-flow-${Environment}
      Description: Outbound contact flow for Quinn AI calls with 2-way Lex bot conversation
      Type: CONTACT_FLOW
      State: ACTIVE
      Content: '{"Version":"2019-10-30","StartAction":"12345678-1234-1234-1234-123456789012","Metadata":{"entryPointPosition":{"x":40,"y":40},"ActionMetadata":{"12345678-1234-1234-1234-123456789012":{"position":{"x":160,"y":40}},"12345678-1234-1234-1234-123456789013":{"position":{"x":360,"y":40}}}},"Actions":[{"Identifier":"12345678-1234-1234-1234-123456789012","Type":"MessageParticipant","Parameters":{"Text":"$.Attributes.message"},"Transitions":{"NextAction":"12345678-1234-1234-1234-123456789013","Errors":[{"NextAction":"12345678-1234-1234-1234-123456789013","ErrorType":"NoMatchingError"}]}},{"Identifier":"12345678-1234-1234-1234-123456789013","Type":"DisconnectParticipant","Parameters":{},"Transitions":{}}]}'

  # ============================================
  # CUSTOM RESOURCE - Update Contact Flow with Lex Bot
  # ============================================

  # Lambda function to update Contact Flow with Lex bot after all resources are created
  ContactFlowUpdaterFunction:
    Type: AWS::Serverless::Function
    Condition: CreateConnectResources
    DependsOn:
      - OutboundContactFlow
      - QuinnLexBotAlias
      - ConnectLexBotAssociation
    Properties:
      FunctionName: !Sub quinn-contact-flow-updater-${Environment}
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - connect:UpdateContactFlowContent
                - connect:DescribeContactFlow
              Resource:
                - !Sub arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstance.Id}/*
      InlineCode: |
        const { ConnectClient, UpdateContactFlowContentCommand } = require('@aws-sdk/client-connect');
        const https = require('https');
        const url = require('url');

        // Custom CloudFormation response function
        async function sendResponse(event, context, status, data) {
          const responseBody = JSON.stringify({
            Status: status,
            Reason: data.Error || 'See CloudWatch logs',
            PhysicalResourceId: context.logStreamName,
            StackId: event.StackId,
            RequestId: event.RequestId,
            LogicalResourceId: event.LogicalResourceId,
            Data: data
          });
          
          const parsedUrl = url.parse(event.ResponseURL);
          const options = {
            hostname: parsedUrl.hostname,
            port: 443,
            path: parsedUrl.path,
            method: 'PUT',
            headers: {
              'Content-Type': '',
              'Content-Length': responseBody.length
            }
          };
          
          return new Promise((resolve, reject) => {
            const req = https.request(options, (res) => {
              console.log('Status code:', res.statusCode);
              resolve();
            });
            req.on('error', (e) => {
              console.error('Error sending response:', e);
              reject(e);
            });
            req.write(responseBody);
            req.end();
          });
        }

        exports.handler = async (event, context) => {
          console.log('Event:', JSON.stringify(event, null, 2));
          
          if (event.RequestType === 'Delete') {
            return sendResponse(event, context, 'SUCCESS', { Message: 'Delete successful' });
          }
          
          const { InstanceId, ContactFlowArn, LexBotId, LexBotAliasId, Environment, Region, AccountId } = event.ResourceProperties;
          
          // Extract Contact Flow ID from ARN
          // ARN format: arn:aws:connect:region:account:instance/instance-id/contact-flow/flow-id
          const ContactFlowId = ContactFlowArn.split('/').pop();
          
          const client = new ConnectClient({ region: Region });
          
          // Contact flow content with Lex bot for 2-way conversation
          const contactFlowContent = {
            "Version": "2019-10-30",
            "StartAction": "greeting-action",
            "Metadata": {
              "entryPointPosition": {"x": 40, "y": 40},
              "ActionMetadata": {
                "greeting-action": {"position": {"x": 160, "y": 40}},
                "lex-bot-action": {"position": {"x": 360, "y": 40}},
                "disconnect-action": {"position": {"x": 560, "y": 40}}
              }
            },
            "Actions": [
              {
                "Identifier": "greeting-action",
                "Type": "MessageParticipant",
                "Parameters": {
                  "Text": "$.Attributes.message"
                },
                "Transitions": {
                  "NextAction": "lex-bot-action",
                  "Errors": [
                    {"NextAction": "lex-bot-action", "ErrorType": "NoMatchingError"}
                  ]
                }
              },
              {
                "Identifier": "lex-bot-action",
                "Type": "ConnectParticipantWithLexBot",
                "Parameters": {
                  "LexBot": {
                    "Name": "quinn-bot-" + Environment,
                    "Region": Region,
                    "AliasArn": "arn:aws:lex:" + Region + ":" + AccountId + ":bot-alias/" + LexBotId + "/" + LexBotAliasId
                  },
                  "LexSessionAttributes": {
                    "callPurpose": "$.Attributes.callPurpose",
                    "callerName": "$.Attributes.callerName",
                    "targetBusiness": "$.Attributes.targetBusiness"
                  }
                },
                "Transitions": {
                  "NextAction": "disconnect-action",
                  "Errors": [
                    {"NextAction": "disconnect-action", "ErrorType": "NoMatchingError"}
                  ]
                }
              },
              {
                "Identifier": "disconnect-action",
                "Type": "DisconnectParticipant",
                "Parameters": {},
                "Transitions": {}
              }
            ]
          };
          
          try {
            const command = new UpdateContactFlowContentCommand({
              InstanceId: InstanceId,
              ContactFlowId: ContactFlowId,
              Content: JSON.stringify(contactFlowContent)
            });
            
            await client.send(command);
            console.log('Contact flow updated successfully');
            
            return sendResponse(event, context, 'SUCCESS', { Message: 'Contact flow updated with Lex bot' });
          } catch (error) {
            console.error('Error updating contact flow:', error);
            return sendResponse(event, context, 'FAILED', { Error: error.message });
          }
        };

  # Custom Resource to trigger the Contact Flow update
  ContactFlowUpdater:
    Type: Custom::ContactFlowUpdater
    Condition: CreateConnectResources
    DependsOn:
      - ContactFlowUpdaterFunction
      - QuinnLexBotAlias
      - ConnectLexBotAssociation
    Properties:
      ServiceToken: !GetAtt ContactFlowUpdaterFunction.Arn
      InstanceId: !GetAtt ConnectInstance.Id
      ContactFlowArn: !GetAtt OutboundContactFlow.ContactFlowArn
      LexBotId: !GetAtt QuinnLexBot.Id
      LexBotAliasId: !GetAtt QuinnLexBotAlias.BotAliasId
      Environment: !Ref Environment
      Region: !Ref AWS::Region
      AccountId: !Ref AWS::AccountId

  # ============================================
  # AMAZON BEDROCK AGENT - AI Conversation
  # ============================================

  # IAM Role for Bedrock Agent
  BedrockAgentRole:
    Type: AWS::IAM::Role
    Condition: CreateConnectResources
    Properties:
      RoleName: !Sub quinn-bedrock-agent-role-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0

  # Bedrock Agent for Quinn AI
  QuinnBedrockAgent:
    Type: AWS::Bedrock::Agent
    Condition: CreateConnectResources
    DependsOn: BedrockAgentRole
    Properties:
      AgentName: !Sub quinn-agent-${Environment}
      AgentResourceRoleArn: !GetAtt BedrockAgentRole.Arn
      FoundationModel: anthropic.claude-3-haiku-20240307-v1:0
      Description: Quinn AI Personal Assistant for phone conversations
      Instruction: |
        You are Quinn, a friendly and professional AI personal assistant making phone calls on behalf of your user.

        Your role is to:
        1. Introduce yourself as Quinn, calling on behalf of the user
        2. Clearly state the purpose of the call
        3. Listen to responses and engage in natural conversation
        4. Gather any required information
        5. Confirm details before ending the call
        6. Thank the person for their time

        Guidelines:
        - Be polite, professional, and concise
        - Speak naturally as if having a phone conversation
        - If you don't understand something, politely ask for clarification
        - Keep responses brief and suitable for voice
        - When the conversation objective is complete, say goodbye and end the call

        Call types you handle:
        - Appointment booking: Schedule appointments with businesses
        - Customer service: Handle inquiries and resolve issues
        - Bill negotiation: Negotiate better rates or discounts
        - Order follow-up: Check on order status
        - General inquiries: Make general phone inquiries
      IdleSessionTTLInSeconds: 600
      AutoPrepare: true

  # Bedrock Agent Alias for deployment
  QuinnBedrockAgentAlias:
    Type: AWS::Bedrock::AgentAlias
    Condition: CreateConnectResources
    DependsOn: QuinnBedrockAgent
    Properties:
      AgentId: !GetAtt QuinnBedrockAgent.AgentId
      AgentAliasName: !Sub quinn-agent-alias-${Environment}
      Description: Production alias for Quinn AI agent

  # ============================================
  # AMAZON LEX V2 BOT - Voice Interaction
  # ============================================

  # IAM Role for Lex Bot
  LexBotRole:
    Type: AWS::IAM::Role
    Condition: CreateConnectResources
    Properties:
      RoleName: !Sub quinn-lex-bot-role-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lexv2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LexBotPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - polly:SynthesizeSpeech
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeAgent
                Resource: !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0

  # Lex V2 Bot for Quinn - With Lambda fulfillment for Bedrock Agent
  QuinnLexBot:
    Type: AWS::Lex::Bot
    Condition: CreateConnectResources
    DependsOn:
      - LexBotRole
      - QuinnBedrockAgentAlias
    Properties:
      Name: !Sub quinn-bot-${Environment}
      Description: Quinn AI Personal Assistant Voice Bot
      RoleArn: !GetAtt LexBotRole.Arn
      DataPrivacy:
        ChildDirected: false
      IdleSessionTTLInSeconds: 300
      AutoBuildBotLocales: true
      BotLocales:
        - LocaleId: en_GB
          NluConfidenceThreshold: 0.4
          VoiceSettings:
            VoiceId: Amy
            Engine: neural
          Intents:
            # Fallback intent - handles all user input via Bedrock Agent
            - Name: FallbackIntent
              Description: Default fallback intent - routes to Bedrock Agent
              ParentIntentSignature: AMAZON.FallbackIntent
              FulfillmentCodeHook:
                Enabled: true

  # Lex Bot Version
  QuinnLexBotVersion:
    Type: AWS::Lex::BotVersion
    Condition: CreateConnectResources
    DependsOn: QuinnLexBot
    Properties:
      BotId: !GetAtt QuinnLexBot.Id
      BotVersionLocaleSpecification:
        - LocaleId: en_GB
          BotVersionLocaleDetails:
            SourceBotVersion: DRAFT

  # Lex Bot Alias - with Lambda fulfillment configuration
  QuinnLexBotAlias:
    Type: AWS::Lex::BotAlias
    Condition: CreateConnectResources
    DependsOn:
      - QuinnLexBotVersion
      - LexFulfillmentFunction
    Properties:
      BotId: !GetAtt QuinnLexBot.Id
      BotAliasName: !Sub quinn-alias-${Environment}
      BotVersion: !GetAtt QuinnLexBotVersion.BotVersion
      BotAliasLocaleSettings:
        - LocaleId: en_GB
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                CodeHookInterfaceVersion: "1.0"
                LambdaArn: !GetAtt LexFulfillmentFunction.Arn

  # Associate Lex Bot with Connect Instance
  ConnectLexBotAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Condition: CreateConnectResources
    DependsOn:
      - ConnectInstance
      - QuinnLexBotAlias
    Properties:
      InstanceId: !GetAtt ConnectInstance.Arn
      IntegrationType: LEX_BOT
      IntegrationArn: !Sub arn:aws:lex:${AWS::Region}:${AWS::AccountId}:bot-alias/${QuinnLexBot.Id}/${QuinnLexBotAlias.BotAliasId}

  # ============================================
  # LEX FULFILLMENT LAMBDA - Bedrock Agent Integration
  # ============================================

  # Lambda function for Lex fulfillment - invokes Bedrock Agent
  LexFulfillmentFunction:
    Type: AWS::Serverless::Function
    Condition: CreateConnectResources
    Properties:
      FunctionName: !Sub quinn-lex-fulfillment-${Environment}
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          BEDROCK_AGENT_ID: !GetAtt QuinnBedrockAgent.AgentId
          BEDROCK_AGENT_ALIAS_ID: !GetAtt QuinnBedrockAgentAlias.AgentAliasId
          ENVIRONMENT: !Ref Environment
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeAgent
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/${QuinnBedrockAgent.AgentId}
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/${QuinnBedrockAgent.AgentId}/*
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0
      InlineCode: |
        const { BedrockAgentRuntimeClient, InvokeAgentCommand } = require('@aws-sdk/client-bedrock-agent-runtime');

        const client = new BedrockAgentRuntimeClient({ region: process.env.AWS_REGION });

        exports.handler = async (event) => {
          console.log('Lex Event:', JSON.stringify(event, null, 2));
          
          const sessionId = event.sessionId || `session-${Date.now()}`;
          const userInput = event.inputTranscript || event.interpretations?.[0]?.intent?.slots?.message?.value?.interpretedValue || 'Hello';
          
          // Get context from session attributes
          const sessionAttributes = event.sessionState?.sessionAttributes || {};
          const callPurpose = sessionAttributes.callPurpose || 'general inquiry';
          const callerName = sessionAttributes.callerName || 'the user';
          
          try {
            // Invoke Bedrock Agent
            const command = new InvokeAgentCommand({
              agentId: process.env.BEDROCK_AGENT_ID,
              agentAliasId: process.env.BEDROCK_AGENT_ALIAS_ID,
              sessionId: sessionId,
              inputText: `[Call purpose: ${callPurpose}] [Caller: ${callerName}] User said: ${userInput}`,
            });
            
            const response = await client.send(command);
            
            // Collect the response chunks
            let agentResponse = '';
            if (response.completion) {
              for await (const chunk of response.completion) {
                if (chunk.chunk?.bytes) {
                  agentResponse += new TextDecoder().decode(chunk.chunk.bytes);
                }
              }
            }
            
            // Default response if agent doesn't respond
            if (!agentResponse) {
              agentResponse = "I'm sorry, I didn't catch that. Could you please repeat?";
            }
            
            console.log('Agent Response:', agentResponse);
            
            // Check if conversation should end
            const shouldEnd = agentResponse.toLowerCase().includes('goodbye') || 
                             agentResponse.toLowerCase().includes('thank you for your time') ||
                             agentResponse.toLowerCase().includes('have a great day');
            
            // Return Lex response
            return {
              sessionState: {
                dialogAction: {
                  type: shouldEnd ? 'Close' : 'ElicitIntent',
                },
                intent: {
                  name: event.sessionState?.intent?.name || 'FallbackIntent',
                  state: shouldEnd ? 'Fulfilled' : 'InProgress',
                },
                sessionAttributes: sessionAttributes,
              },
              messages: [
                {
                  contentType: 'PlainText',
                  content: agentResponse,
                },
              ],
            };
          } catch (error) {
            console.error('Error invoking Bedrock Agent:', error);
            
            return {
              sessionState: {
                dialogAction: {
                  type: 'ElicitIntent',
                },
                intent: {
                  name: event.sessionState?.intent?.name || 'FallbackIntent',
                  state: 'InProgress',
                },
                sessionAttributes: sessionAttributes,
              },
              messages: [
                {
                  contentType: 'PlainText',
                  content: "I'm having trouble processing that. Could you please repeat?",
                },
              ],
            };
          }
        };

  # Permission for Lex to invoke the fulfillment Lambda
  LexFulfillmentPermission:
    Type: AWS::Lambda::Permission
    Condition: CreateConnectResources
    Properties:
      FunctionName: !Ref LexFulfillmentFunction
      Action: lambda:InvokeFunction
      Principal: lexv2.amazonaws.com
      SourceArn: !Sub arn:aws:lex:${AWS::Region}:${AWS::AccountId}:bot-alias/${QuinnLexBot.Id}/${QuinnLexBotAlias.BotAliasId}

  RecordingsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateConnectResources
    Properties:
      BucketName: !Sub quinn-recordings-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldRecordings
            Status: Enabled
            ExpirationInDays: 90
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30

  # ============================================
  # SNS/PINPOINT - SMS & Push Notifications
  # ============================================

  # Amazon Pinpoint Application for SMS (used for phone validation)
  PinpointApp:
    Type: AWS::Pinpoint::App
    Condition: CreateSMSResources
    Properties:
      Name: !Sub quinn-pinpoint-${Environment}

  # Note: SMS is sent via Pinpoint SMS Voice V2 API directly
  # The Sender ID "QUINN" has been registered for GB in eu-west-2

  # SNS Topic for SMS webhooks
  SMSWebhookTopic:
    Type: AWS::SNS::Topic
    Condition: CreateSMSResources
    Properties:
      TopicName: !Sub quinn-sms-webhooks-${Environment}
      DisplayName: Quinn SMS Webhooks

  # SNS Platform Application for iOS Push (APNS)
  # Note: Certificate must be uploaded manually or via CI/CD
  SNSPlatformApplicationIOS:
    Type: AWS::SNS::Topic
    Condition: CreatePushResources
    Properties:
      TopicName: !Sub quinn-push-ios-${Environment}
      DisplayName: Quinn iOS Push Notifications

  # SNS Platform Application for Android Push (FCM)
  # Note: API key must be configured manually or via CI/CD
  SNSPlatformApplicationAndroid:
    Type: AWS::SNS::Topic
    Condition: CreatePushResources
    Properties:
      TopicName: !Sub quinn-push-android-${Environment}
      DisplayName: Quinn Android Push Notifications

  # ============================================
  # COGNITO - Authentication
  # ============================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub quinn-users-${Environment}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: given_name
          Required: false
          Mutable: true
        - Name: family_name
          Required: false
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub quinn-client-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED

  # ============================================
  # DYNAMODB - Database
  # ============================================
  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub quinn-main-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: gsi2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ============================================
  # API GATEWAY + LAMBDA
  # ============================================
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub quinn-api-${Environment}
      CodeUri: ../backend/dist
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:*
              Resource: !GetAtt UserPool.Arn
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0
        - !If
          - CreateConnectResources
          - Statement:
              - Effect: Allow
                Action:
                  - connect:StartOutboundVoiceContact
                  - connect:StopContact
                  - connect:DescribeContact
                  - connect:GetContactAttributes
                  - connect:UpdateContactAttributes
                Resource:
                  - !Sub arn:aws:connect:${AWS::Region}:${AWS::AccountId}:instance/${ConnectInstance.Id}/*
              - Effect: Allow
                Action:
                  - polly:SynthesizeSpeech
                  - polly:DescribeVoices
                Resource: "*"
              - Effect: Allow
                Action:
                  - transcribe:StartTranscriptionJob
                  - transcribe:GetTranscriptionJob
                  - transcribe:ListTranscriptionJobs
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt RecordingsBucket.Arn
                  - !Sub ${RecordingsBucket.Arn}/*
          - !Ref AWS::NoValue
        # SMS permissions (Pinpoint SMS Voice V2)
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
                - sns:SetSMSAttributes
              Resource: "*"
            - Effect: Allow
              Action:
                - mobiletargeting:SendMessages
                - mobiletargeting:PhoneNumberValidate
                - mobiletargeting:GetSmsChannel
              Resource: "*"
            - Effect: Allow
              Action:
                - sms-voice:SendTextMessage
                - sms-voice:DescribeSenderIds
                - sms-voice:DescribeVerifiedDestinationNumbers
              Resource: "*"
        # Push notification permissions
        - Statement:
            - Effect: Allow
              Action:
                - sns:CreatePlatformEndpoint
                - sns:DeleteEndpoint
                - sns:GetEndpointAttributes
                - sns:SetEndpointAttributes
                - sns:Publish
              Resource: "*"
      Events:
        # Public endpoint for Gmail OAuth callback (no auth required)
        GmailCallbackEvent:
          Type: Api
          Properties:
            Path: /integrations/gmail/callback
            Method: GET
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: NONE
        # All other endpoints (with Cognito auth)
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref ApiGateway

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub quinn-api-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PATCH,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Request-ID'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # ============================================
  # S3 + CLOUDFRONT - Frontend Hosting
  # ============================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub quinn-frontend-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref CloudFrontOAC
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub quinn-oac-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  FrontendUrl:
    Description: CloudFront Distribution URL
    Value: !Sub https://${CloudFrontDistribution.DomainName}

  FrontendBucketName:
    Description: S3 Bucket for frontend
    Value: !Ref FrontendBucket

  DynamoDBTableName:
    Description: DynamoDB Table Name
    Value: !Ref MainTable

  ConnectInstanceId:
    Condition: CreateConnectResources
    Description: Amazon Connect Instance ID
    Value: !GetAtt ConnectInstance.Id

  ConnectInstanceArn:
    Condition: CreateConnectResources
    Description: Amazon Connect Instance ARN
    Value: !GetAtt ConnectInstance.Arn

  ConnectContactFlowArn:
    Condition: CreateConnectResources
    Description: Amazon Connect Contact Flow ARN
    Value: !GetAtt OutboundContactFlow.ContactFlowArn

  ConnectQueueArn:
    Condition: CreateConnectResources
    Description: Amazon Connect Queue ARN
    Value: !GetAtt ConnectQueue.QueueArn

  RecordingsBucketName:
    Condition: CreateConnectResources
    Description: S3 Bucket for call recordings
    Value: !Ref RecordingsBucket

  QuinnLexBotId:
    Condition: CreateConnectResources
    Description: Quinn Lex Bot ID
    Value: !GetAtt QuinnLexBot.Id

  QuinnLexBotAliasId:
    Condition: CreateConnectResources
    Description: Quinn Lex Bot Alias ID
    Value: !GetAtt QuinnLexBotAlias.BotAliasId

  QuinnBedrockAgentId:
    Condition: CreateConnectResources
    Description: Quinn Bedrock Agent ID
    Value: !GetAtt QuinnBedrockAgent.AgentId

  ConnectSetupInstructions:
    Condition: CreateConnectResources
    Description: Instructions to complete Connect setup
    Value: !Sub |
      Amazon Connect has been created with AI capabilities. To complete setup:
      1. Go to AWS Console > Amazon Connect > ${ConnectInstance.Id}
      2. Click "Claim a phone number" and select a UK number (+44)
      3. Update the ConnectSourcePhoneNumber parameter with the claimed number
      4. Update the Contact Flow to use the Lex bot for 2-way conversation:
         - Open the Contact Flow in the Connect Console
         - Add a "Get customer input" block with Lex bot: ${QuinnLexBot.Id}
         - Configure the flow to loop for continuous conversation
      5. Redeploy the stack

  PinpointAppId:
    Condition: CreateSMSResources
    Description: Amazon Pinpoint Application ID
    Value: !Ref PinpointApp

  SMSWebhookTopicArn:
    Condition: CreateSMSResources
    Description: SNS Topic ARN for SMS webhooks
    Value: !Ref SMSWebhookTopic

  PushNotificationSetupInstructions:
    Condition: CreatePushResources
    Description: Instructions to complete push notification setup
    Value: |
      Push notifications infrastructure has been created. To complete setup:
      1. For iOS: Upload your APNS certificate in AWS Console > SNS > Platform Applications
      2. For Android: Configure your FCM API key in AWS Console > SNS > Platform Applications
      3. Update the SNS_PLATFORM_ARN_IOS and SNS_PLATFORM_ARN_ANDROID environment variables
      4. Redeploy the stack
